services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-classroom-backend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: smart-classroom-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
